spring.application.name=apartment-search-agent
server.port=8080

# Демо-база с вымышленными объявлениями (работает без интернета и ключей)
app.listings.demo-enabled=true
# Свой файл с реальными объявлениями в формате демо-базы. Личные данные — в репозиторий не коммитить.
# Пример запуска: mvnw spring-boot:run -Dspring-boot.run.arguments=--app.listings.import-file=C:/data/listings.json
app.listings.import-file=

# Claude-агент. Ключ берётся из переменной окружения ANTHROPIC_API_KEY.
app.agent.model=claude-opus-5-5
app.agent.max-turns=12
app.agent.fallbacks=true
app.agent.search-domains=cian.ru,avito.ru,realty.yandex.ru,domclick.ru
